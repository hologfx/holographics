name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    # Skip release-please's own PRs. A bot PR never needs a signature, and the
    # action locks every PR it sees on merge, which breaks release-please's
    # post-release comment and aborts the release run.
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the final release (v2.6.1) of the now-archived action;
        # self-contained, signatures live in this repo.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/hologfx/holographics/blob/master/.github/CLA.md"
          branch: "master"
          allowlist: "dependabot[bot],*[bot]"
